  opacity: 35
terminal_colors:
  normal:
    black:   '#2a261b'
    red:     '#e89388'
    green:   '#b4cda0'
    yellow:  '#ecca7c'
    blue:    '#a9c2dd'
    magenta: '#d2b4e0'
    cyan:    '#9ddada'
    white:   '#f1e9cf'
  bright:
    black:   '#3e3826'
    red:     '#f4a8a0'
    green:   '#c8dcb6'
    yellow:  '#f3d990'
    blue:    '#bcd2e8'
    magenta: '#dec3eb'
    cyan:    '#b1e6e6'
    white:   '#fff9e0'
