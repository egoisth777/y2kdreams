# y2kdream — Butter (Dark)
# A dreamy, eye-friendly theme inspired by Y2K-era pastel computing.
# Drop this in: ~/.warp/themes/butter-dark.yaml
# Background image: place "butter.svg" in the same folder.

name: 'y2kdream Butter Dark'
accent: '#e8c878'
background: '#1f1c14'
foreground: '#f1e9cf'
details: 'darker'
background_image:
