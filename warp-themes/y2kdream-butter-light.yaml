  opacity: 35
terminal_colors:
  normal:
    black:   '#3b3520'
    red:     '#c25d6e'
    green:   '#7a9266'
    yellow:  '#b88d3a'
    blue:    '#7793b8'
    magenta: '#a983b8'
    cyan:    '#5fa0a0'
    white:   '#e9e0c5'
  bright:
    black:   '#5d5238'
    red:     '#d97a8a'
    green:   '#94aa80'
    yellow:  '#d4a352'
    blue:    '#92acce'
    magenta: '#c19fd0'
    cyan:    '#7cbcbc'
    white:   '#fdf8e6'
