# y2kdream — Butter (Light)
# A dreamy, eye-friendly theme inspired by Y2K-era pastel computing.
# Drop this in: ~/.warp/themes/butter-light.yaml
# Background image: place "butter.svg" in the same folder.

name: 'y2kdream Butter Light'
accent: '#c8a455'
background: '#fbf6e8'
foreground: '#3b3520'
details: 'lighter'
background_image:
