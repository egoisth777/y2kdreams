# y2kdream — Lavender (Light)
# A dreamy, eye-friendly theme inspired by Y2K-era pastel computing.
# Drop this in: ~/.warp/themes/lavender-light.yaml
# Background image: place "lavender.svg" in the same folder.

name: 'y2kdream Lavender Light'
accent: '#8e72b8'
background: '#f6f1fa'
foreground: '#2f2839'
details: 'lighter'
background_image:
