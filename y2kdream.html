<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>y2kdream — color scheme</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    transition: background .35s ease, color .35s ease;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .serif { font-family: 'Fraunces', ui-serif, Georgia, serif; font-optical-sizing: auto; }
  .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ── App shell ── */
  #app { min-height: 100vh; position: relative; }

  /* dreamy gradient atmosphere */
  .atmosphere {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(60% 40% at 12% 8%, var(--accent-soft) 0%, transparent 60%),
      radial-gradient(50% 40% at 92% 18%, var(--accent-3-soft) 0%, transparent 65%),
      radial-gradient(70% 50% at 80% 95%, var(--accent-2-soft) 0%, transparent 60%);
    opacity: .9;
    transition: opacity .35s ease;
  }
  [data-theme="dark"] .atmosphere { opacity: .6; }

  main { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 64px 48px 120px; }

  /* ── Header ── */
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; padding-bottom: 28px; border-bottom: .5px solid var(--divider); }
  .wordmark {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 64px; letter-spacing: -0.04em;
    line-height: .95; color: var(--text);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 50%, var(--accent-3) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .wordmark em { font-style: italic; font-weight: 400; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 14px;
  }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .lede { color: var(--text-muted); max-width: 520px; font-size: 14.5px; line-height: 1.55; margin: 14px 0 0; }
  .meta { font-size: 11px; color: var(--text-subtle); text-align: right; line-height: 1.7; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--text-muted); font-weight: 500; }

  /* ── Sections ── */
  section { margin-top: 56px; }
  h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; color: var(--text); }
  .sec-sub { color: var(--text-subtle); font-size: 12px; margin-bottom: 22px; letter-spacing: .04em; text-transform: uppercase; }

  /* Swatches */
  .swatch-row { display: grid; gap: 10px; }
  .ramp { display: grid; grid-template-columns: 110px repeat(8, 1fr); gap: 4px; align-items: stretch; }
  .ramp-name { display: flex; flex-direction: column; justify-content: center; padding: 0 4px;
    font-size: 12px; color: var(--text-muted); }
  .ramp-name b { color: var(--text); font-size: 13px; font-weight: 500; }
  .swatch {
    height: 72px; border-radius: 10px; position: relative; overflow: hidden;
    border: .5px solid var(--border);
    box-shadow: 0 1px 0 color-mix(in oklch, white 40%, transparent) inset;
    cursor: default; transition: transform .15s ease, box-shadow .2s ease;
  }
  .swatch:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); z-index: 2; }
  .swatch .lbl {
    position: absolute; left: 8px; bottom: 6px; font-size: 9.5px;
    font-family: 'JetBrains Mono', monospace; color: var(--text);
    background: color-mix(in oklch, var(--bg-elevated) 75%, transparent);
    backdrop-filter: blur(6px);
    padding: 2px 5px; border-radius: 4px;
  }

  /* Token grid */
  .tokens-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .token-card {
    background: var(--bg-elevated); border: .5px solid var(--border); border-radius: 12px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow-sm);
  }
  .token-card .chip { height: 56px; border-radius: 8px; border: .5px solid var(--border); position: relative; overflow: hidden; }
  .token-card .chip.checker {
    background-image:
      linear-gradient(45deg, var(--surface-sunk) 25%, transparent 25%),
      linear-gradient(-45deg, var(--surface-sunk) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--surface-sunk) 75%),
      linear-gradient(-45deg, transparent 75%, var(--surface-sunk) 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
  }
  .token-card .chip-inner { position: absolute; inset: 0; }
  .tk-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tk-name { font-size: 12px; color: var(--text); font-weight: 500; font-family: 'JetBrains Mono', monospace; }
  .tk-val { font-size: 10.5px; color: var(--text-subtle); font-family: 'JetBrains Mono', monospace; text-align: right; }

  /* Type specimens */
  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .type-card { padding: 24px; border-radius: 14px; background: var(--bg-elevated); border: .5px solid var(--border); }
  .type-card .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-subtle); margin-bottom: 14px; }
  .specimen-1 { font-family: 'Fraunces', serif; font-size: 56px; line-height: 1; letter-spacing: -.03em; font-weight: 500; color: var(--text); margin: 0; }
  .specimen-1 em { font-style: italic; font-weight: 400; color: var(--accent); }
  .specimen-2 { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.55; color: var(--text-muted); margin: 12px 0 0; max-width: 38ch; }
  .specimen-mono { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.6; color: var(--text); white-space: pre; }

  /* ── UI mockup: dreambox terminal ── */
  .mock-frame {
    border-radius: 16px; overflow: hidden;
    border: .5px solid var(--border-strong);
    box-shadow: var(--shadow-lg);
    background: var(--bg-elevated);
  }
  .mock-titlebar {
    height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 14px;
    background: var(--surface); border-bottom: .5px solid var(--divider);
  }
  .traffic { display: flex; gap: 7px; }
  .traffic span { width: 11px; height: 11px; border-radius: 50%; background: var(--border-strong); display: block; }
  .traffic span:nth-child(1) { background: var(--y2k-rose-500); }
  .traffic span:nth-child(2) { background: var(--y2k-butter-500); }
  .traffic span:nth-child(3) { background: var(--y2k-forest-500); }
  [data-theme="dark"] .traffic span { opacity: .85; }
  .mock-tabs { display: flex; gap: 2px; flex: 1; }
  .mock-tab { font-size: 11.5px; padding: 5px 12px; border-radius: 6px 6px 0 0; color: var(--text-muted); }
  .mock-tab.active { background: var(--bg-elevated); color: var(--text); border: .5px solid var(--divider); border-bottom: 0; position: relative; top: .5px; }
  .mock-search {
    flex: 0 0 240px; height: 22px; border-radius: 6px;
    background: var(--surface-sunk); border: .5px solid var(--divider);
    display: flex; align-items: center; padding: 0 8px; gap: 6px;
    font-size: 11px; color: var(--text-subtle);
  }
  .mock-body { display: grid; grid-template-columns: 200px 1fr 1fr; min-height: 420px; }
  .mock-side { background: var(--surface); border-right: .5px solid var(--divider); padding: 14px 12px; }
  .side-search {
    height: 28px; border-radius: 8px; background: var(--bg-elevated);
    border: .5px solid var(--divider); display: flex; align-items: center; padding: 0 10px;
    color: var(--text-subtle); font-size: 11.5px; gap: 8px; margin-bottom: 14px;
  }
  .side-group { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-subtle); padding: 6px 8px; }
  .side-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px; color: var(--text-muted); }
  .side-item.active { background: var(--accent-soft); color: var(--text); }
  .side-item .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .6; }

  .mock-pane { padding: 14px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.55; overflow: hidden; border-right: .5px solid var(--divider); }
  .mock-pane:last-child { border-right: 0; }
  .pane-prev { font-size: 10.5px; color: var(--text-subtle); padding: 6px 0; border-top: .5px dashed var(--divider); border-bottom: .5px dashed var(--divider); margin: 8px 0; letter-spacing: .04em; }
  .pane-prompt { color: var(--text-muted); }
  .pane-prompt b { color: var(--accent); font-weight: 500; }
  .pane-prompt .t { color: var(--text-subtle); }
  .pane-line { color: var(--text); }
  .pane-line a, .pane-line .link { color: var(--syn-prop); text-decoration: none; }
  .pane-bullet { color: var(--accent-2); }
  .pane-files { display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 0 8px; }
  .pane-files span { color: var(--syn-prop); }
  .pane-error { background: var(--danger-soft); border-left: 2px solid var(--danger); padding: 8px 10px; border-radius: 0 8px 8px 0; margin: 8px 0; }
  .pane-error .err { color: var(--danger); }
  .mock-runbar { height: 32px; border-top: .5px solid var(--divider); display: flex; align-items: center; padding: 0 14px; gap: 14px; font-size: 11px; color: var(--text-subtle); background: var(--surface); }
  .mock-runbar .pill { padding: 2px 8px; border-radius: 4px; background: var(--bg-elevated); border: .5px solid var(--divider); color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

  /* ── Component samples ── */
  .comps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .comp-card { background: var(--bg-elevated); border: .5px solid var(--border); border-radius: 14px; padding: 22px; box-shadow: var(--shadow-sm); }
  .comp-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-subtle); margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn { font-family: inherit; font-size: 13px; padding: 8px 16px; border-radius: 8px; border: .5px solid var(--border-strong); background: var(--bg-elevated); color: var(--text); cursor: default; transition: transform .15s ease, background .2s ease; }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: transparent;
    box-shadow: 0 1px 0 color-mix(in oklch, white 40%, transparent) inset, var(--shadow-sm); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; border-color: var(--divider); color: var(--text-muted); }
  .btn-soft { background: var(--accent-soft); color: var(--text); border-color: transparent; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .badge.success { background: var(--success-soft); color: var(--success); }
  .badge.warning { background: var(--warning-soft); color: var(--warning); }
  .badge.danger  { background: var(--danger-soft);  color: var(--danger);  }
  .badge.info    { background: var(--info-soft);    color: var(--info);    }
  .badge .dot    { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .input-shell { display: flex; flex-direction: column; gap: 6px; }
  .input-shell label { font-size: 11.5px; color: var(--text-muted); }
  .input { height: 34px; padding: 0 12px; border-radius: 8px; border: .5px solid var(--border); background: var(--surface-sunk); color: var(--text); font: inherit; font-size: 13px; outline: none; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--bg-elevated); }

  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%);
    border: .5px solid var(--glass-border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 0 color-mix(in oklch, white 40%, transparent) inset, var(--shadow-md);
  }
  .glass-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .glass-desc { font-size: 12.5px; color: var(--text-muted); margin: 0; }

  .progress { height: 6px; border-radius: 999px; background: var(--surface-sunk); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: inherit; }

  /* Code sample */
  .codeblock { background: var(--surface-sunk); border: .5px solid var(--border); border-radius: 12px; padding: 18px 20px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.65; overflow: auto; }
  .codeblock .c { color: var(--syn-comment); font-style: italic; }
  .codeblock .k { color: var(--syn-keyword); }
  .codeblock .s { color: var(--syn-string); }
  .codeblock .n { color: var(--syn-number); }
  .codeblock .f { color: var(--syn-function); }
  .codeblock .p { color: var(--syn-prop); }
  .codeblock .t { color: var(--syn-tag); }
  .codeblock .v { color: var(--syn-var); }
  .codeblock .pn { color: var(--syn-punct); }

  /* footer note */
  .footnote { margin-top: 80px; font-size: 11.5px; color: var(--text-subtle); text-align: center; letter-spacing: .04em; }
  .footnote .star { color: var(--accent); }

  /* sparkles */
  .sparkle { display: inline-block; transform: translateY(-2px); }

  /* responsive */
  @media (max-width: 900px) {
    main { padding: 32px 22px 80px; }
    .hero { flex-direction: column; align-items: flex-start; gap: 16px; }
    .meta { text-align: left; }
    .ramp { grid-template-columns: 90px repeat(4, 1fr); }
    .ramp .swatch:nth-child(n+6) { display: none; }
    .type-grid, .comps { grid-template-columns: 1fr; }
    .mock-body { grid-template-columns: 1fr; }
    .mock-side, .mock-pane { border-right: 0; border-bottom: .5px solid var(--divider); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
